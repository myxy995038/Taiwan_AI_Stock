[project]
name = "taiwan-ai-stock-system"
version = "10.0.0"
description = "Taiwan AI Stock System - V10 Ultimate Enterprise"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "志真" }
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]